[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "cep-ufv-skill"
version = "1.7.1"
description = "Skill travada aos templates oficiais do CEP/UFV — gera pacote documental (docx+pdf) sem sair do padrão"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "PesquisAI/UFVAI"}
]
keywords = ["cep", "ufv", "etica", "tcle", "tale", "plataforma-brasil", "skill"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://cep.ufv.br/modelos/"
Repository = "https://github.com/seu-usuario/cep-ufv"
Issues = "https://github.com/seu-usuario/cep-ufv/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
